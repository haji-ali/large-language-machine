# Large Language Machine configuration, shared by every script on every machine
# and by Scripts/deploy.sh. After editing, run Scripts/deploy.sh to copy it to
# the machines and restart everything that reads it.
#
# Format: KEY=value, one per line. Quote values that contain spaces, using
# single quotes if they contain $, ` or \. The shell scripts source this file
# and the Python scripts read it with llm_config.py; `python3 llm_config.py`
# checks it and prints what it contains.

# ---- Network ----------------------------------------------------------------

# Wi-Fi network run by the router inside the machine
WIFI_SSID="Large Language Machine"
ROUTER_IP=192.168.1.1

# Every machine: its name, IP address and the systemd services it runs
# (comma-separated, from Scripts/). The scripts look machines up by these names,
# so keep them. inference is the main PC and runs the MQTT broker.
MACHINES="
inference       192.168.1.10   launch-ll-machine.service,shutdown-readers.service
uhf             192.168.1.11   read-uhf.service,reader-power.service
rfid-dataset    192.168.1.12   read-rfid.service,reader-power.service
button-knob     192.168.1.13   read-button.service,read-pot.service,reader-power.service
rfid-questions  192.168.1.14   read-rfid.service,reader-power.service
"

# Login on every machine (Scripts/deploy.sh connects as this user)
SSH_USER=nathan

# ---- Paths ------------------------------------------------------------------

# Where the code lives on each machine: relative to SSH_USER's home, or absolute
LLM_DIR=large-language-machine
# Python virtual environment on inference, relative to LLM_DIR
VENV_DIR=venv
# Python that runs the scripts on the Raspberry Pis
READER_PYTHON=/usr/bin/python3
# Serial ports of the RFID readers (rfid-dataset, rfid-questions) and the UHF reader
RFID_SERIAL_PORT=/dev/ttyS0
UHF_SERIAL_PORT=/dev/ttyAMA0

# ---- MQTT -------------------------------------------------------------------

MQTT_PORT=2883
# The broker's systemd service on inference. shutdown-readers.service is
# ordered so that it powers the readers off before this service stops.
BROKER_SERVICE=mosquitto.service

# ---- Hardware ---------------------------------------------------------------

# GPIO pins on button-knob (BCM numbering)
BUTTON_PIN=24
BUTTON_LED_PIN=23
# MCP3008 channel the Randomness knob is wired to
KNOB_ADC_CHANNEL=0
# Pin that enables the UHF reader module (physical pin number)
UHF_ENABLE_PIN=7

# ---- Behaviour --------------------------------------------------------------

# Seconds without activity before the start screen comes back
IDLE_TIMEOUT=60
# Seconds to wait for a response from the model before showing an error
INFERENCE_TIMEOUT=20

# ---- Power ------------------------------------------------------------------

# What the Raspberry Pis do when inference powers off, and when it reboots:
# poweroff, reboot or nothing. A Pi that has powered off stays off until its
# power is switched off and on again.
READERS_ON_PC_POWEROFF=poweroff
READERS_ON_PC_REBOOT=nothing
# Seconds inference waits for the Pis to shut down before it powers off (at most 100)
READER_SHUTDOWN_TIMEOUT=45
